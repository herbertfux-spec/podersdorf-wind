<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌬 Podersdorf Wind</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:15px;
    background:#f5f7fa;
}

h1{
    text-align:center;
    color:#1f4e78;
}

#update{
    text-align:center;
    margin-bottom:15px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#1f4e78;
    color:white;
    padding:10px;
}

td{
    text-align:center;
    padding:4px 8px;
    border-bottom:1px solid #ddd;
    line-height:1.15;
}

tr{
    height:30px;
}

/* Animierte Pfeile */
.arrow {
    display:inline-block;
    font-size:20px;
    transition: transform 0.4s ease-in-out;
    animation: windPulse 2.2s infinite ease-in-out;
}

@keyframes windPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.25); }
    100% { transform: scale(1); }
}

/* Kompaktere Pfeilbox */
.arrow-box {
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:28px;
    height:28px;
    border:1px solid #999;
    border-radius:6px;
    background:#fff;
    margin:auto;
}
</style>
</head>

<table>

<script>

/* Farbskala für Wind */
function windFarbe(kn) {

    if (kn <= 9) return "#ffffff";
    if (kn >= 10 && kn <= 11) return "#d9d9d9";

    if (kn >= 12 && kn <= 20) {
        const t = (kn - 12) / (20 - 12);
        const r = Math.round(200 - t * 120);
        const g = Math.round(255 - t * 155);
        const b = Math.round(200 - t * 120);
        return `rgb(${r},${g},${b})`;
    }

    if (kn > 20 && kn <= 30) {
        const t = (kn - 20) / (30 - 20);
        const r = Math.round(220 - t * 80);
        const g = Math.round(200 - t * 140);
        const b = Math.round(60 - t * 60);
        return `rgb(${r},${g},${b})`;
    }

    if (kn > 30 && kn <= 37) {
        const t = (kn - 30) / (37 - 30);
        const r = Math.round(220 - t * 120);
        const g = Math.round(180 - t * 160);
        const b = Math.round(255 - t * 100);
        return `rgb(${r},${g},${b})`;
    }

    if (kn > 37) return "#4b0082";

    return "inherit";
}
