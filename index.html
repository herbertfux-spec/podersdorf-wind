<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podersdorf Wind aktuell</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 15px;
        background: #f7f7f7;
        color: #333;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 24px;
    }

    #update {
        text-align: center;
        font-size: 14px;
        margin-bottom: 15px;
        color: #555;
    }

    #windChart {
        text-align: center;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    th {
        background: #eaeaea;
        padding: 10px;
        font-size: 15px;
        border-bottom: 2px solid #ccc;
        text-align: center;
        font-weight: 600;
    }

    td {
        padding: 8px;
        font-size: 15px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }

    tr:nth-child(even) {
        background: #fafafa;
    }

    td div {
        line-height: 1;
    }
</style>
</head>

<body>

<h1>Podersdorf Wind aktuell</h1>
<div id="update">Aktualisiert:</div>

<!-- Mini-Diagramm oberhalb der Tabelle -->
<div id="windChart"></div>

<table>
<thead>
<tr>
    <th>Zeit</th>
    <th>Dir</th>
    <th>Wind(kt)</th>
    <th>Gust(kt)</th>
    <th>Temp</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
