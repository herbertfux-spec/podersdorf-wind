<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌬 Podersdorf Wind</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:15px;
    background:#f5f7fa;
}

h1{
    text-align:center;
    color:#1f4e78;
}

#update{
    text-align:center;
    margin-bottom:15px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#1f4e78;
    color:white;
    padding:10px;
}

td{
    text-align:center;
    padding:8px;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f2f2f2;
}

/* Animierte Pfeile */
.arrow {
    display:inline-block;
    font-size:22px;
    transition: transform 0.4s ease-in-out;
    animation: windPulse 2.2s infinite ease-in-out;
}

@keyframes windPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.25); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<h1>🌬 Podersdorf Wind aktuell</h1>

<div id="update">Lade Daten...</div>

<table>
<thead>
<tr>
<th>Zeit</th>
<th>Richtung</th>
<th>Wind</th>
<th>Böen</th>
<th>Temp</th>
</tr>
</thead>
<tbody id="wind"></tbody>
</table>

<script>

/* Farbskala für Wind */
function windFarbe(kn) {

    if (kn < 10) return "#d9d9d9";

    if (kn >= 12 && kn <= 20) {
        const t = (kn - 12) / (20 - 12); 
        const r = Math.round(200 - t * 120);
        const g = Math.round(255 - t * 155);
        const b = Math.round(200 - t * 120);
        return `rgb(${r},${g},${b})`;
    }

    if (kn > 20 && kn <= 30) {
        const t = (kn - 20) / (30 - 20);
        const r = Math.round(220 - t * 80);
        const g = Math.round(200 - t * 140);
        const b = Math.round(60 - t * 60);
        return `rgb(${r},${g},${b})`;
    }

    if (kn > 30 && kn <= 37) {
        const t = (kn - 30) / (37 - 30);
        const r = Math.round(220 - t * 120);
        const g = Math.round(180 - t * 160);
        const b = Math.round(255 - t * 100);
        return `rgb(${r},${g},${b})`;
    }

    if (kn > 37) return "#4b0082";

    return "inherit";
}

/* 8-Sektoren Windrichtung (wie auf deinem Screenshot) */
function windHimmelsrichtung(deg){

    if (deg >= 337.5 || deg < 22.5) return "↑ N";
    if (deg >= 22.5 && deg < 67.5) return "↗ NE";
    if (deg >= 67.5 && deg < 112.5) return "→ E";
    if (deg >= 112.5 && deg < 157.5) return "↘ SE";
    if (deg >= 157.5 && deg < 202.5) return "↓ S";
    if (deg >= 202.5 && deg < 247.5) return "↙ SW";
    if (deg >= 247.5 && deg < 292.5) return "← W";
    if (deg >= 292.5 && deg < 337.5) return "↖ NW";

    return "?";
}

/* Daten laden */
async function ladeDaten(){

    const response = await fetch("wind.json?t=" + Date.now());
    const daten = await response.json();

    let html = "";

    daten.forEach(ds => {

        const zeit =
            new Date(ds.datetime)
            .toLocaleTimeString(
                "de-AT",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    timeZone:"Europe/Vienna"
                }
            );

        html += `
        <tr>
            <td>${zeit}</td>
            <td>${windHimmelsrichtung(ds.directionDegree)}</td>
            <td style="background:${windFarbe(ds.avg)}">${ds.avg} kn</td>
            <td style="background:${windFarbe(ds.gust)}">${ds.gust} kn</td>
            <td>${ds.temp} °C</td>
        </tr>
        `;
    });

    document.getElementById("wind").innerHTML = html;

    document.getElementById("update").innerHTML =
        "Aktualisiert: " +
        new Date().toLocaleString("de-AT");
}

ladeDaten();
setInterval(ladeDaten,60000);

</script>

</body>
</html>
