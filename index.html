<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌬 Podersdorf Wind</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:15px;
    background:#f5f7fa;
}

h1{
    text-align:center;
    color:#1f4e78;
}

#update{
    text-align:center;
    margin-bottom:15px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#1f4e78;
    color:white;
    padding:10px;
}

td{
    text-align:center;
    padding:8px;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f2f2f2;
}
</style>
</head>

<body>

<h1>🌬 Podersdorf Wind aktuell</h1>

<div id="update">Lade Daten...</div>

<table>
<thead>
<tr>
<th>Zeit</th>
<th>Richtung</th>
<th>Wind</th>
<th>Böen</th>
<th>Temp</th>
</tr>
</thead>
<tbody id="wind"></tbody>
</table>

<script>

async function ladeDaten(){

    const response = await fetch("wind.json?t=" + Date.now());
    const daten = await response.json();

    let html = "";

    daten.forEach(ds => {

        const zeit =
            new Date(ds.datetime)
            .toLocaleTimeString(
                "de-AT",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    timeZone:"Europe/Vienna"
                }
            );

        html += `
        <tr>
            <td>${zeit}</td>
            <td>${ds.direction}</td>
            <td>${ds.avg} kn</td>
            <td>${ds.gust} kn</td>
            <td>${ds.temp} °C</td>
        </tr>
        `;
    });

    document.getElementById("wind").innerHTML = html;

    document.getElementById("update").innerHTML =
        "Aktualisiert: " +
        new Date().toLocaleString("de-AT");
}

ladeDaten();

setInterval(ladeDaten,60000);

</script>

</body>
</html>
