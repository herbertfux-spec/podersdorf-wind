name: Update Wind Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wind data
        run: |
          curl -L "https://www.getnora.app/api/station/kite2fly-podersdorf?limit=30" -o wind.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add wind.json

          # Commit nur wenn sich die Datei geändert hat
          git diff --staged --quiet || git commit -m "Update wind data"

          git push
