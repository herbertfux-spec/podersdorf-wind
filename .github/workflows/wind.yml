name: Update Wind Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

            - name: Download wind data
        run: |
          curl -L "https://www.getnora.app/api/station/kite2fly-podersdorf?limit=30" -o wind.json
          echo "Updated $(date)" > last_update.txt

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

           git add wind.json last_update.txt

          git diff --staged --quiet || git commit -m "Update wind data"

          git push
