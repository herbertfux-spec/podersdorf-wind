name: Update Wind Data (reactivated v3 - force schedule reload)
# reload

on:
  schedule:
    - cron: "*/2 * * * *"   # every 2 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch raw data from Nora API
        run: |
          curl -L "https://www.getnora.app/api/station/kite2fly-podersdorf?limit=30" -o raw.json

      - name: Generate cleaned wind.json
        run: |
          echo "[" > wind.json

          jq -c '.[] | {
              datetime: .datetime,
              avg: (.avg | tonumber),
              gust: (.gust | tonumber),
              directionDegree: (.directionDegree | tonumber),
              temp: (.temp | tonumber)
          }' raw.json | sed 's/$/,/' >> wind.json

          # letztes Komma entfernen
          sed -i '$ s/,$//' wind.json

          echo "]" >> wind.json

      - name: Commit and push updated data to main
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add wind.json
          git commit -m "Auto-update wind data (v3)" || true
          git push origin main

      - name: Push wind.json to gh-pages
        run: |
          # gh-pages holen
          git fetch origin gh-pages

          # gh-pages auschecken
          git checkout gh-pages

          # wind.json aus main kopieren
          git checkout main -- wind.json

          # committen und pushen
          git add wind.json
          git commit -m "Update wind.json on gh-pages" || true
          git push origin gh-pages
