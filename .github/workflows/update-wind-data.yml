name: Update Wind Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch wind data (with retries)
        run: |
          for i in {1..5}; do
            echo "Attempt $i to download wind data..."
            curl -s -L "https://www.getnora.app/api/station/kite2fly-podersdorf?limit=30" -o wind.json && break
            sleep 2
          done

      - name: Validate JSON
        run: |
          echo "Validating JSON..."
          jq empty wind.json

      - name: Commit only if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          if git diff --quiet wind.json; then
            echo "No changes in wind.json – skipping commit."
            exit 0
          fi

          git add wind.json
          git commit -m "Update wind data"
          git push
