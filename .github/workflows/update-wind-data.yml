name: Update Wind Data (reactivated)

on:
  # Cron neu aktiviert
  schedule:
    - cron: "*/2 * * * *"   # alle 2 Minuten
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch raw data from Nora API
        run: |
          curl -L "https://www.getnora.app/api/station/kite2fly-podersdorf?limit=30" -o raw.json

      - name: Generate cleaned wind.json
        run: |
          echo "[" > wind.json

          jq -c '.[] | {
              datetime: .datetime,
              avg: (.avg | tonumber),
              gust: (.gust | tonumber),
              directionDegree: (.directionDegree | tonumber),
              temp: (.temp | tonumber)
          }' raw.json >> wind.json

          echo "]" >> wind.json

          # Timestamp hinzufügen, damit die Datei IMMER anders ist
          echo "// updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> wind.json

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add wind.json
          git commit -m "Auto-update wind data" || true
          git push
