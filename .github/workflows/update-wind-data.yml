name: Update Wind Data (reactivated v3 - force schedule reload)

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Fetch raw data
        run: |
          curl -L "https://www.getnora.app/api/station/kite2fly-podersdorf?limit=30" -o repo-main/raw.json

      - name: Generate cleaned wind.json
        run: |
          echo "[" > repo-main/wind.json

          jq -c '.[] | {
              datetime: .datetime,
              avg: (.avg | tonumber),
              gust: (.gust | tonumber),
              directionDegree: (.directionDegree | tonumber),
              temp: (.temp | tonumber)
          }' repo-main/raw.json | sed 's/$/,/' >> repo-main/wind.json

          sed -i '$ s/,$//' repo-main/wind.json
          echo "]" >> repo-main/wind.json

      - name: Commit to main
        run: |
          cd repo-main
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add wind.json
          git commit -m "Auto-update wind data" || true
          git push origin main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo-pages

      - name: Copy wind.json to gh-pages
        run: |
          cp repo-main/wind.json repo-pages/wind.json
          cd repo-pages
          git add wind.json
          git commit -m "Update wind.json on gh-pages" || true
          git push origin gh-pages

      - name: Force GitHub Pages rebuild
        run: |
          echo "updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > repo-pages/.pages-build-trigger
          cd repo-pages
          git add .pages-build-trigger
          git commit -m "Trigger GitHub Pages rebuild" || true
          git push origin gh-pages
